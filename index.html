<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>scioly.app</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function(){try{var k='scioly.theme';var v=localStorage.getItem(k)||'hud';var d=window.matchMedia('(prefers-color-scheme: dark)').matches;var t=v==='system'?(d?'sleek':'paper'):v;if(['hud','sleek','paper'].indexOf(t)<0)t='hud';document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='hud'}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
